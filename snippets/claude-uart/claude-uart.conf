# Claude-usage serial + ZMK Studio RPC over USB (central half only).
CONFIG_SERIAL=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Required by ZMK Studio's UART transport (from the upstream
# studio-rpc-usb-uart snippet, folded in here — see the overlay comment).
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_UART_LINE_CTRL=y
